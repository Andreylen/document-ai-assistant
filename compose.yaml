services:

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres-ai
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    image: document-ai-api
    container_name: document-ai-api
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434

    volumes:
      - ./data:/app/data:ro

    depends_on:
      - qdrant
      - postgres

    restart: unless-stopped


volumes:

  qdrant_storage:
    external: true

  postgres_data:
    external: true